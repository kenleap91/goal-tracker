<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>目標トラッカー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="auth-screen" class="auth-screen" hidden>
  <div class="auth-card">
    <h1>目標トラッカー</h1>
    <p class="auth-sub">メールでログインしてください</p>
    <form id="auth-form">
      <label class="field-label">
        メールアドレス
        <input type="email" id="auth-email-input" required autocomplete="email" placeholder="you@example.com">
      </label>
      <button type="submit" id="auth-submit-btn" class="btn-primary auth-submit">確認コードを送る</button>
    </form>
    <form id="auth-code-form" hidden>
      <label class="field-label">
        確認コード(メールに届いた数字)
        <input type="text" id="auth-code-input" required inputmode="numeric" pattern="[0-9]*" maxlength="10" autocomplete="one-time-code" placeholder="12345678">
      </label>
      <button type="submit" id="auth-code-submit-btn" class="btn-primary auth-submit">ログイン</button>
    </form>
    <p id="auth-message" class="auth-message" hidden></p>
  </div>
</div>

<div id="app" hidden>

  <header class="app-header">
    <div class="date-nav">
      <button id="prev-day" class="icon-btn" aria-label="前の日">‹</button>
      <h1 id="current-date-label">-</h1>
      <button id="next-day" class="icon-btn" aria-label="次の日">›</button>
    </div>
    <div class="header-actions">
      <button id="today-btn" class="pill-btn">今日</button>
      <button id="logout-btn" class="icon-btn" aria-label="ログアウト" title="ログアウト">⎋</button>
    </div>
  </header>

  <div id="date-strip" class="date-strip"></div>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="today">記録</button>
    <button class="tab-btn" data-tab="calendar">カレンダー</button>
    <button class="tab-btn" data-tab="stats">統計</button>
  </nav>

  <main>
    <section id="tab-today" class="tab-panel active">
      <ul id="activity-list" class="activity-list"></ul>
      <p id="empty-state" class="empty-state" hidden>まだ目標がありません。右下の + から追加しましょう。</p>
    </section>

    <section id="tab-calendar" class="tab-panel">
      <div class="calendar-header">
        <button id="cal-prev" class="icon-btn" aria-label="前の月">‹</button>
        <h2 id="cal-month-label">-</h2>
        <button id="cal-next" class="icon-btn" aria-label="次の月">›</button>
      </div>
      <div class="calendar-weekdays" id="calendar-weekdays"></div>
      <div id="calendar-grid" class="calendar-grid"></div>
      <div id="calendar-day-detail" class="day-detail"></div>
    </section>

    <section id="tab-stats" class="tab-panel">
      <div class="stats-header">
        <button id="csv-export-btn" class="csv-export-btn">
          <span class="csv-export-icon" aria-hidden="true">⬇</span>
          CSV書き出し
        </button>
      </div>
      <ul id="stats-list" class="stats-list"></ul>
      <p id="stats-empty" class="empty-state" hidden>まだ目標がありません。</p>
    </section>
  </main>

  <button id="add-activity-btn" class="fab" aria-label="目標を追加">+</button>
</div>

<dialog id="add-activity-dialog">
  <form id="add-activity-form">
    <h2>新しい目標</h2>
    <label class="field-label">
      名前
      <input type="text" id="activity-name-input" required maxlength="30" placeholder="例: ランニング" autocomplete="off">
    </label>
    <p class="field-label">色</p>
    <div class="color-picker" id="color-picker"></div>
    <div class="dialog-actions">
      <button type="button" id="cancel-add-btn" class="btn-secondary">キャンセル</button>
      <button type="submit" id="confirm-add-btn" class="btn-primary">追加</button>
    </div>
  </form>
</dialog>

<dialog id="activity-detail-dialog">
  <form method="dialog">
    <h2 id="detail-activity-name">-</h2>
    <div class="stat-row">
      <div class="stat-box">
        <span class="stat-number" id="detail-current-streak">0</span>
        <span class="stat-caption">現在の連続日数</span>
      </div>
      <div class="stat-box">
        <span class="stat-number" id="detail-best-streak">0</span>
        <span class="stat-caption">最長記録</span>
      </div>
      <div class="stat-box">
        <span class="stat-number" id="detail-total-count">0</span>
        <span class="stat-caption">合計達成日数</span>
      </div>
    </div>
    <p id="detail-last-done" class="detail-last-done"></p>
    <div class="dialog-actions">
      <button type="button" id="delete-activity-btn" class="btn-danger">この目標を削除</button>
      <button type="submit" class="btn-primary">閉じる</button>
    </div>
  </form>
</dialog>

<dialog id="csv-export-dialog">
  <form id="csv-export-form">
    <h2>CSV書き出し</h2>
    <label class="field-label">
      開始日
      <input type="date" id="csv-start-date" required>
    </label>
    <label class="field-label">
      終了日
      <input type="date" id="csv-end-date" required>
    </label>
    <p id="csv-export-error" class="detail-last-done" hidden></p>
    <div class="dialog-actions">
      <button type="button" id="csv-cancel-btn" class="btn-secondary">キャンセル</button>
      <button type="submit" class="btn-primary">書き出す</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/storage.js"></script>
<script src="js/streaks.js"></script>
<script src="js/server-repository.js"></script>
<script src="js/app.js"></script>
<script src="js/main.js"></script>
</body>
</html>
